services:
  db:
    image: postgres:15-alpine
    container_name: tracker360_db
    restart: always
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - tracker360_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    mem_limit: ${DB_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    # Imagen autocontenida: el codigo va dentro de la imagen (sin montar la carpeta del repo).
    # Para actualizar: git pull && docker compose up -d --build
    # El HTTPS lo pone el proxy del servidor: reenvia por http a este puerto (API_BIND 0.0.0.0 para que llegue).
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tracker360_api
    restart: always
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8001}:8000"
    mem_limit: ${API_MEM_LIMIT:-384m}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  tracker360_pgdata:
