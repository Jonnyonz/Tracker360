services:
  db:
    image: postgres:15-alpine
    container_name: tracker360_db
    restart: always
    env_file:
      - .env
    volumes:
      - tracker360_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tracker_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: tracker360_api
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  tracker360_pgdata: