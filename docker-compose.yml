services:
  db:
    image: postgres:15-alpine
    container_name: tracker360_db
    restart: always
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - tracker360_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    mem_limit: ${DB_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    # Imagen autocontenida: el codigo va dentro de la imagen (sin montar la carpeta del repo).
    # Para actualizar: git pull && docker compose up -d --build
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tracker360_api
    restart: always
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Argentina/Buenos_Aires}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8001}:8000"
    mem_limit: ${API_MEM_LIMIT:-384m}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  caddy:
    # HTTPS delante de la API. Lo activa install.sh (COMPOSE_PROFILES=https en el .env) y escribe
    # caddy/Caddyfile: con dominio saca el certificado solo; sin dominio usa la IP del servidor con la CA
    # local de Caddy. Sin HTTPS la sesion no se guarda desde otra PC (la cookie es Secure).
    image: caddy:2-alpine
    container_name: tracker360_caddy
    profiles: ["https"]
    restart: always
    depends_on:
      - api
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:${CADDY_HTTP_PORT-80}:80"
      - "0.0.0.0:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tracker360_caddy_data:/data
      - tracker360_caddy_config:/config
    mem_limit: ${CADDY_MEM_LIMIT:-128m}

volumes:
  tracker360_pgdata:
  tracker360_caddy_data:
  tracker360_caddy_config:
